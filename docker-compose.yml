services:
  tts-studio:
    image: ywsj/tts-studio:latest
    container_name: tts-studio
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - SECRET_KEY=${SECRET_KEY:-tts-web-secret-key-change-me}
    volumes:
      - ./output:/app/output
