<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ywsj-tts-studio - 登录</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --brand: #6366f1; }
        body {
            font-family: -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        .login-title { text-align: center; margin-bottom: 28px; }
        .login-title i { font-size: 2.5rem; color: var(--brand); }
        .login-title h2 { margin-top: 8px; font-size: 1.4rem; font-weight: 700; }
        .btn-login {
            background: var(--brand); border-color: var(--brand);
            color: #fff; font-weight: 600; padding: 12px;
            width: 100%; border-radius: 8px;
        }
        .btn-login:hover { background: #5558e3; border-color: #5558e3; }
    </style>
</head>
<body>
    <div class="login-card card">
        <div class="login-title">
            <i class="bi bi-mic-fill"></i>
            <h2>ywsj-tts-studio</h2>
            <small class="text-muted">字幕转语音</small>
        </div>
        {% if error %}
        <div class="alert alert-danger mb-3">
            <i class="bi bi-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" name="username" placeholder="用户名" autofocus required>
                </div>
            </div>
            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" name="password" placeholder="密码" required>
                </div>
            </div>
            <a href="https://github.com/yyzq-cf/ywsj-tts-studio" target="_blank" class="btn btn-outline-secondary w-100 mb-2"><i class="bi bi-github"></i> GitHub</a>
        <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right"></i> 登录
            </button>
        </form>
    </div>
</body>
</html>
